[workspace]
members = ["crates/maverick-core", "crates/maverick-store", "crates/maverick-cli", "crates/maverick-packs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = { version = "0.8", features = ["parse", "display"] }
ratatui = "0.30"
maverick-core = { path = "crates/maverick-core" }
maverick-store = { path = "crates/maverick-store" }
maverick-packs = { path = "crates/maverick-packs" }
